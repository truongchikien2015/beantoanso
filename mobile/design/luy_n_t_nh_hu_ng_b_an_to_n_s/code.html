<!DOCTYPE html>

<html class="light" lang="vi"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chunky-btn {
            box-shadow: 0 6px 0 0 rgba(0, 74, 198, 1);
            transition: all 0.1s ease;
        }
        .chunky-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0, 74, 198, 1);
        }
        .chunky-card {
            box-shadow: 0 4px 0 0 #e0e3e5;
        }
        .progress-bar-container {
            background-color: #dbe1ff;
            border-radius: 9999px;
            height: 16px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            background-color: #004ac6;
            height: 100%;
            width: 50%;
            border-radius: 9999px;
            transition: width 0.5s ease-in-out;
        }
        .choice-btn {
            box-shadow: 0 4px 0 0 #e0e3e5;
            transition: all 0.1s ease;
        }
        .choice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #e0e3e5;
        }
        .correct-choice {
            background-color: #ffdf9f !important;
            border-color: #8b6700 !important;
            box-shadow: 0 4px 0 0 #8b6700 !important;
        }
        .correct-choice:active {
            box-shadow: 0 2px 0 0 #8b6700 !important;
        }
        
        #success-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }
        #success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        #success-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #success-overlay.active #success-sheet {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md pb-24 md:pb-0 h-screen overflow-hidden flex flex-col">
<!-- Header Area -->
<header class="flex flex-col px-margin-mobile pt-md pb-sm w-full max-w-content mx-auto z-10 bg-surface">
<div class="flex items-center justify-between mb-sm">
<button aria-label="Quay lại" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-center flex-1 mx-xs">Tình huống: Người lạ tặng quà game</h1>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</div>
<!-- Progress Bar -->
<div class="flex items-center gap-xs">
<div class="progress-bar-container flex-1">
<div class="progress-bar-fill relative">
<!-- Mascot Head Marker -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-6 h-6 bg-tertiary-fixed rounded-full border-2 border-white flex items-center justify-center shadow-sm z-10">
<span class="material-symbols-outlined text-tertiary-container" style="font-size: 14px;">pets</span>
</div>
</div>
</div>
<span class="font-label-bold text-label-bold text-primary ml-sm whitespace-nowrap">Câu 2/4</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile w-full max-w-content mx-auto flex flex-col relative pb-md">
<!-- Chat UI Container -->
<div class="flex-1 flex flex-col justify-end min-h-[250px] mb-lg relative">
<!-- Chat Bubble from Stranger -->
<div class="flex items-start gap-sm mb-md self-start w-11/12 md:w-3/4">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<div class="bg-surface-container-highest rounded-2xl rounded-tl-sm p-sm chunky-card relative">
<p class="font-body-lg text-body-lg text-on-surface">
                        Anh tặng em 5.000 kim cương miễn phí nhé. Em gửi mã OTP để xác nhận quà nha!
                    </p>
<span class="absolute -bottom-5 left-2 font-label-md text-label-md text-on-surface-variant opacity-70">10:05 AM</span>
</div>
</div>
</div>
<!-- Action Choices Container -->
<div class="flex flex-col gap-sm w-full mt-auto">
<button class="choice-btn w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-sm flex items-center gap-sm text-left hover:bg-surface-container-low transition-colors group" onclick="handleWrongChoice(this)">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">A</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Gửi mã OTP</span>
</button>
<button class="choice-btn w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-sm flex items-center gap-sm text-left hover:bg-surface-container-low transition-colors group" onclick="handleWrongChoice(this)">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">B</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Bấm vào link nhận quà</span>
</button>
<button class="choice-btn w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-sm flex items-center gap-sm text-left hover:bg-surface-container-low transition-colors group" onclick="handleCorrectChoice(this)">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">C</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Không trả lời và chặn người này</span>
</button>
<button class="choice-btn w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-sm flex items-center gap-sm text-left hover:bg-surface-container-low transition-colors group" onclick="handleCorrectChoice(this)">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">D</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Chụp màn hình và báo người lớn</span>
</button>
</div>
</main>
<!-- Success Overlay / Bottom Sheet -->
<div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center bg-on-surface/40" id="success-overlay">
<div class="w-full sm:max-w-md bg-surface rounded-t-[2rem] sm:rounded-[2rem] p-md pt-lg relative shadow-2xl pb-8 sm:pb-md border-t-8 border-tertiary-fixed-dim" id="success-sheet">
<!-- Close button for accessibility, though typically hidden in this flow -->
<button class="absolute top-sm right-sm w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors" onclick="hideSuccess()">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex flex-col items-center text-center">
<div class="w-32 h-32 mb-sm -mt-16 bg-surface rounded-full p-2 border-4 border-tertiary-fixed-dim shadow-lg">
<img class="w-full h-full object-cover rounded-full" data-alt="Cute owl mascot named Cú Cú, wearing glasses and holding a small protective shield with a safety checkmark icon. Modern flat vector illustration style, friendly expression, primary blue and warm yellow color scheme, high contrast, white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxqKieRxuS3MlvFe2cUnNR3xK_033-2ZIKKhCqMbQ_uku6a2hY3L1UzXq2bvR53R0WTwcbkyNHgRMejtetleztnt1smzaF0Qnl_CYCaUmkN3M-gc-4WL6z1AWBHRKXf_AIob8kS3hUUxBgCTFbC7nqlcChbF-Xjq1Tt2Rfe0IqtS3TGD_d22qxciCMXeMO8VxPXhpQrc3sDjG-bVS8kMlqVOE10wvLHe7ZBt_vvmVW4F-a4VXXEDY_VkIcUkkCi0z-tL0ZXqAkATQ"/>
</div>
<h2 class="font-headline-lg text-headline-lg text-primary mb-xs">Con làm rất tốt!</h2>
<p class="font-body-lg text-body-lg text-on-surface mb-md">
                    Mã OTP là bí mật. Người tốt sẽ không xin mã OTP của con.
                </p>
<button class="w-full h-14 bg-primary text-on-primary font-label-bold text-label-bold rounded-xl chunky-btn flex items-center justify-center gap-2" onclick="hideSuccess()">
                    Tiếp tục
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Bottom Nav Bar (Mobile Only per Semantic Shell Logic - hidden on this screen as it's a linear task/simulation) -->
<!-- Navigation is SUPPRESSED on this Linear/Task-focused screen to prioritize the Canvas -->
<script>
        function handleWrongChoice(btn) {
            // Shake animation for wrong choice
            btn.classList.add('animate-[shake_0.5s_ease-in-out]');
            btn.style.borderColor = '#ba1a1a';
            btn.style.backgroundColor = '#ffdad6';
            setTimeout(() => {
                btn.classList.remove('animate-[shake_0.5s_ease-in-out]');
                btn.style.borderColor = '';
                btn.style.backgroundColor = '';
            }, 500);
        }

        function handleCorrectChoice(btn) {
            // Highlight correct choice
            btn.classList.add('correct-choice');
            
            // Show success overlay after a brief delay
            setTimeout(() => {
                document.getElementById('success-overlay').classList.add('active');
            }, 300);
        }

        function hideSuccess() {
            document.getElementById('success-overlay').classList.remove('active');
            // Reset correct choices
            document.querySelectorAll('.correct-choice').forEach(btn => {
                btn.classList.remove('correct-choice');
            });
        }
        
        // Add shake animation to tailwind config dynamically for wrong choice
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body></html>
