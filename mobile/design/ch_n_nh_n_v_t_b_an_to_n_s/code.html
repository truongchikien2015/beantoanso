<!-- Minimal JS for interactivity simulation (Active state toggling) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const avatarButtons = document.querySelectorAll('main button');
            
            avatarButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Reset all buttons to unselected state
                    avatarButtons.forEach(btn => {
                        // Remove selected classes
                        btn.classList.remove('bg-primary-fixed', 'border-[3px]', 'border-primary', 'tactile-shadow-selected');
                        // Add unselected classes back
                        btn.classList.add('bg-surface-container-lowest', 'border-2', 'border-outline-variant', 'tactile-shadow-card', 'hover:-translate-y-1', 'hover:tactile-shadow-card', 'active:translate-y-1', 'active:tactile-shadow-card-active');
                        
                        // Remove checkmark badge
                        const badge = btn.querySelector('.absolute.-top-3');
                        if (badge) badge.remove();

                        // Adjust text and image classes
                        const textSpan = btn.querySelector('span:not(.material-symbols-outlined)');
                        textSpan.classList.replace('font-label-bold', 'font-body-lg');
                        textSpan.classList.replace('text-label-bold', 'text-body-lg');
                        textSpan.classList.replace('text-on-primary-fixed', 'text-on-surface-variant');

                        const imgContainer = btn.querySelector('.rounded-full');
                        imgContainer.classList.replace('border-primary-fixed-dim', 'border-surface-variant');
                        
                        const img = imgContainer.querySelector('img');
                        img.classList.add('opacity-90');
                    });

                    // Set clicked button to selected state
                    this.classList.remove('bg-surface-container-lowest', 'border-2', 'border-outline-variant', 'tactile-shadow-card', 'hover:-translate-y-1', 'hover:tactile-shadow-card', 'active:translate-y-1', 'active:tactile-shadow-card-active');
                    this.classList.add('bg-primary-fixed', 'border-[3px]', 'border-primary', 'tactile-shadow-selected');

                    // Add checkmark badge
                    const checkmarkHTML = `
                        <div class="absolute -top-3 -right-3 bg-tertiary-fixed-dim border-[3px] border-surface-container-lowest text-on-tertiary-fixed rounded-full p-1.5 shadow-md flex items-center justify-center animate-[popIn_0.3s_ease-out]">
                            <span class="material-symbols-outlined text-base font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
                        </div>
                    `;
                    this.insertAdjacentHTML('afterbegin', checkmarkHTML);

                    // Adjust text and image classes for active state
                    const textSpan = this.querySelector('span:not(.material-symbols-outlined)');
                    textSpan.classList.replace('font-body-lg', 'font-label-bold');
                    textSpan.classList.replace('text-body-lg', 'text-label-bold');
                    textSpan.classList.replace('text-on-surface-variant', 'text-on-primary-fixed');

                    const imgContainer = this.querySelector('.rounded-full');
                    imgContainer.classList.replace('border-surface-variant', 'border-primary-fixed-dim');
                    
                    const img = imgContainer.querySelector('img');
                    img.classList.remove('opacity-90');
                });
            });
        });
    </script>
