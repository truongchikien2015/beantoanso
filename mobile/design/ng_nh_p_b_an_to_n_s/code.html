<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Input Styles */
        input:focus {
            box-shadow: none !important;
        }
        
        /* Chunky Button Shadow */
        .btn-chunky {
            box-shadow: 0 4px 0 0 rgba(0, 74, 198, 1);
            transition: all 0.1s ease;
        }
        .btn-chunky:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 rgba(0, 74, 198, 1);
        }
        
        /* Background Pattern */
        .bg-pattern {
            background-color: #f7f9fb;
            background-image: radial-gradient(#dbe1ff 2px, transparent 2px);
            background-size: 32px 32px;

<body class="bg-pattern min-h-screen w-full flex flex-col justify-center items-center text-on-surface p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-surface-variant p-md flex flex-col items-center">
<!-- Header & Mascot -->
<div class="flex flex-col items-center mb-lg w-full">
<div class="w-32 h-32 rounded-full bg-primary-fixed mb-md flex items-center justify-center overflow-hidden border-4 border-surface-container-lowest shadow-sm">
<img alt="Cú Cú An Toàn" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtD8TgCYHhNGPUcR1HFEgW0UAXPQdD34asu3T047iNi2e7LqBmrmiAosUj-oo2BZT-No5NbMzazIbGVqK_tqiCap30dr-2EeR-6Mqc52_46EWotCGn_WWpJ-q3-wJhvP4JVmaP4ikecR_lIvHK9R9Gd_y0wfQlEc5dq7cMygidKBLr6sJq1BWGXnLHfl9nipz4lh_COZBXHRrKRGrZOck3yWbR4AuKHM-RV1lURPuGQmzRAI1L51fxBdPo"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary text-center mb-base">Đăng nhập lớp học</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Sử dụng mã của thầy cô để vào lớp nhé!</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-sm" onsubmit="event.preventDefault(); alert('Đăng nhập thành công!');">
<!-- Class Code Input -->
<div class="relative w-full">
<label class="sr-only" for="classCode">Mã lớp học</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">school</span>
</div>
<input class="w-full bg-surface-container-low border-2 border-surface-variant rounded-lg py-sm pl-[44px] pr-sm font-body-lg text-body-lg text-on-surface focus:border-primary focus:outline-none transition-colors placeholder:text-outline h-[56px]" id="classCode" placeholder="Mã lớp học" required="" type="text"/>
</div>
<!-- Student ID Input -->
<div class="relative w-full">
<label class="sr-only" for="studentId">Mã số học sinh</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<input class="w-full bg-surface-container-low border-2 border-surface-variant rounded-lg py-sm pl-[44px] pr-sm font-body-lg text-body-lg text-on-surface focus:border-primary focus:outline-none transition-colors placeholder:text-outline h-[56px]" id="studentId" placeholder="Mã số học sinh" required="" type="text"/>
</div>
<!-- Password Input -->
<div class="relative w-full mb-md">
<label class="sr-only" for="password">Mật khẩu</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full bg-surface-container-low border-2 border-surface-variant rounded-lg py-sm pl-[44px] pr-[44px] font-body-lg text-body-lg text-on-surface focus:border-primary focus:outline-none transition-colors placeholder:text-outline h-[56px]" id="password" placeholder="Mật khẩu" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility</span>
</button>
</div>
<!-- CTA Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-label-bold text-label-bold rounded-full btn-chunky flex items-center justify-center gap-xs" type="submit">
                Vào lớp ngay
                <span class="material-symbols-outlined fill-icon">arrow_forward</span>
</button>
</form>
<!-- Helper Text -->
<div class="mt-lg text-center flex flex-col items-center gap-base">
<div class="w-12 h-1 bg-surface-variant rounded-full mb-base"></div>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-outline text-[18px]">help</span>
                Nếu con quên mã, hãy hỏi thầy cô hoặc bố mẹ nhé.
            </p>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
