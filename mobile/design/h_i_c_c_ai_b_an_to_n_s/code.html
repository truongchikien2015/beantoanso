<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pb-[80px]">
<!-- Top App Bar -->
<header class="bg-surface docked full-width top-0 sticky z-50">
<div class="flex items-center justify-between px-margin-mobile py-base w-full max-w-content mx-auto">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex items-center gap-sm">
<img alt="Cú Cú An Toàn Avatar" class="w-12 h-12 rounded-full border-2 border-primary-container bg-white object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxqKieRxuS3MlvFe2cUnNR3xK_033-2ZIKKhCqMbQ_uku6a2hY3L1UzXq2bvR53R0WTwcbkyNHgRMejtetleztnt1smzaF0Qnl_CYCaUmkN3M-gc-4WL6z1AWBHRKXf_AIob8kS3hUUxBgCTFbC7nqlcChbF-Xjq1Tt2Rfe0IqtS3TGD_d22qxciCMXeMO8VxPXhpQrc3sDjG-bVS8kMlqVOE10wvLHe7ZBt_vvmVW4F-a4VXXEDY_VkIcUkkCi0z-tL0ZXqAkATQ"/>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Cú Cú An Toàn</h1>
<p class="font-label-md text-label-md text-primary flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
                            Luôn sẵn sàng giúp con
                        </p>
</div>
</div>
</div>
<button aria-label="Options" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</button>
</div>
</header>
<!-- Main Chat Area -->
<main class="flex-grow w-full max-w-content mx-auto px-margin-mobile py-md flex flex-col gap-lg pb-32">
<!-- Chat Date/Time Separator -->
<div class="flex justify-center">
<span class="bg-surface-container-low px-4 py-1 rounded-full font-label-md text-label-md text-on-surface-variant">Hôm nay</span>
</div>
<!-- Student Message -->
<div class="flex justify-end mb-sm">
<div class="max-w-[85%] md:max-w-[70%]">
<div class="bg-primary-container text-on-primary-container p-4 rounded-t-2xl rounded-l-2xl rounded-br-sm shadow-[0_4px_0_0_rgba(0,74,198,1)]">
<p class="font-body-lg text-body-lg">Có người bảo nạp thẻ game để nhận kim cương, con có nên làm không?</p>
</div>
<div class="flex justify-end mt-1">
<span class="font-label-md text-label-md text-outline">10:14 AM</span>
</div>
</div>
</div>
<!-- Cú Cú Response -->
<div class="flex justify-start mb-sm gap-sm items-end">
<img alt="Cú Cú An Toàn Avatar" class="w-8 h-8 rounded-full border border-surface-variant bg-white object-cover hidden md:block" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxqKieRxuS3MlvFe2cUnNR3xK_033-2ZIKKhCqMbQ_uku6a2hY3L1UzXq2bvR53R0WTwcbkyNHgRMejtetleztnt1smzaF0Qnl_CYCaUmkN3M-gc-4WL6z1AWBHRKXf_AIob8kS3hUUxBgCTFbC7nqlcChbF-Xjq1Tt2Rfe0IqtS3TGD_d22qxciCMXeMO8VxPXhpQrc3sDjG-bVS8kMlqVOE10wvLHe7ZBt_vvmVW4F-a4VXXEDY_VkIcUkkCi0z-tL0ZXqAkATQ"/>
<div class="max-w-[85%] md:max-w-[70%]">
<div class="bg-surface-container text-on-surface p-4 rounded-t-2xl rounded-r-2xl rounded-bl-sm shadow-[0_4px_0_0_#d8dadc]">
<p class="font-body-lg text-body-lg">Con không nên nạp thẻ hoặc gửi mã thẻ cho người lạ nhé. Đây có thể là lừa đảo. Con hãy hỏi bố mẹ hoặc thầy cô trước khi làm.</p>
</div>
<div class="flex justify-start mt-1">
<span class="font-label-md text-label-md text-outline">10:15 AM</span>
</div>
</div>
</div>
<!-- Quick Chips Suggestions -->
<div class="flex flex-wrap gap-sm mt-md">
<button class="bg-surface-container-lowest border-2 border-primary text-primary px-4 py-3 rounded-full font-label-bold text-label-bold flex items-center gap-xs shadow-[0_4px_0_0_rgba(0,74,198,1)] hover:bg-primary-fixed transition-colors active:translate-y-[2px] active:shadow-[0_2px_0_0_rgba(0,74,198,1)]">
<span class="material-symbols-outlined text-primary text-sm">chat</span>
                Kiểm tra tin nhắn
            </button>
<button class="bg-surface-container-lowest border-2 border-primary text-primary px-4 py-3 rounded-full font-label-bold text-label-bold flex items-center gap-xs shadow-[0_4px_0_0_rgba(0,74,198,1)] hover:bg-primary-fixed transition-colors active:translate-y-[2px] active:shadow-[0_2px_0_0_rgba(0,74,198,1)]">
<span class="material-symbols-outlined text-primary text-sm">school</span>
                Học về lừa đảo game
            </button>
<button class="bg-surface-container-lowest border-2 border-primary text-primary px-4 py-3 rounded-full font-label-bold text-label-bold flex items-center gap-xs shadow-[0_4px_0_0_rgba(0,74,198,1)] hover:bg-primary-fixed transition-colors active:translate-y-[2px] active:shadow-[0_2px_0_0_rgba(0,74,198,1)]">
<span class="material-symbols-outlined text-primary text-sm">shield_person</span>
                Báo người lớn
            </button>
</div>
</main>
<!-- Chat Input Area -->
<div class="fixed bottom-[80px] md:bottom-0 left-0 w-full bg-surface-bright border-t border-surface-variant p-margin-mobile z-40">
<div class="max-w-content mx-auto flex items-end gap-sm">
<button aria-label="Attach" class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">attach_file</span>
</button>
<div class="flex-grow relative">
<textarea class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-3xl py-3 px-4 pr-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-0 resize-none max-h-32 min-h-[56px] shadow-[0_2px_0_0_#e0e3e5]" placeholder="Hỏi Cú Cú về an toàn trên mạng..." rows="1" style="scrollbar-width: none;"></textarea>
<button aria-label="Send" class="absolute right-2 bottom-2 w-10 h-10 flex items-center justify-center rounded-full bg-primary text-on-primary hover:bg-primary-fixed-variant transition-colors shadow-[0_2px_0_0_#00174b] active:translate-y-[1px] active:shadow-[0_1px_0_0_#00174b]">
<span class="material-symbols-outlined fill-icon">send</span>
</button>
</div>
<button aria-label="Voice input" class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
</div>
<!-- Red SOS FAB -->
<button aria-label="SOS Alert" class="fixed bottom-24 right-4 md:bottom-24 md:right-[calc(50%-530px)] z-50 w-16 h-16 bg-error text-on-error rounded-full flex items-center justify-center shadow-[0_6px_0_0_#93000a] hover:bg-error-container hover:text-on-error-container active:translate-y-[2px] active:shadow-[0_4px_0_0_#93000a] transition-all">
<span class="material-symbols-outlined text-[32px] fill-icon">sos</span>
</button>
<!-- Bottom Nav Bar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-4 pt-2 bg-surface-container rounded-t-lg shadow-lg border-t-4 border-surface-variant">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright rounded-xl transition-all w-16">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-bold text-[10px]">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 translate-y-[-2px] shadow-[0_4px_0_0_rgba(0,74,198,1)] transition-all min-w-[72px]">
<span class="material-symbols-outlined mb-1 fill-icon">school</span>
<span class="font-label-bold text-[10px]">Luyện kỹ năng</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright rounded-xl transition-all w-16">
<span class="material-symbols-outlined mb-1">security</span>
<span class="font-label-bold text-[10px]">Quét nguy hiểm</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright rounded-xl transition-all w-16">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-bold text-[10px]">Hồ sơ</span>
</button>
</nav>
<script>
        // Auto-resize textarea
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') {
                this.style.height = '56px';
            }
        });
    </script>
</body></html>
