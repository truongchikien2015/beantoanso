<!DOCTYPE html>

<html lang="vi"><head>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "lg": "40px"

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .tactile-active:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
            margin-bottom: 4px;
        }
        .striped-bg {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.1),
                rgba(255,255,255,0.1) 10px,
                transparent 10px,
                transparent 20px
            );
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-md antialiased pb-28 pt-20 flex flex-col md:items-center">
<!-- JSON Component: TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 bg-surface flex items-center justify-between px-margin-mobile py-base max-w-[1100px] mx-auto md:px-lg md:border-b-0 shadow-sm md:shadow-none">
<div class="flex items-center gap-sm hover:opacity-80 transition-transform duration-150 active:scale-95 cursor-pointer">
<img alt="Ảnh đại diện của bé" class="w-12 h-12 rounded-full border-[3px] border-primary object-cover" data-alt="A close up portrait avatar of a cheerful young Vietnamese boy around 10 years old with short black hair, wearing a casual bright yellow t-shirt. The background is a solid soft pastel blue. The lighting is bright and even, creating a friendly, modern, light-mode UI aesthetic. The mood is highly positive and trustworthy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtguRtC6nx6Ck-ZMN8sqhtAm70mGjpm02SxrbQ_v3Z7MOdFd7YUIWq-GVmHSAcuTUYUt6Dz-0275gQ7ia8YcS-vZRBHaHyneLpd2xiK4PV_fHDGo7mhILyBV-paqFtNgJnJd25MKLz0XoOsL4gM5JxjZnTCBlDG9_VcDYHi_CQ9CeZvx13KDfNpaTfDuxyQicUJHuuSAX9KsSUbN0QD_dqIaNL8vLFoYbCxUb1t2x8mItjM46Lck-lo_zRmDqBXVGzbI7KfjvRXnc"/>
<h1 class="font-headline-md text-headline-md text-primary">Chào con, bạn nhỏ!</h1>
</div>
<button class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary hover:bg-surface-container active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1100px] px-margin-mobile md:px-lg flex flex-col gap-lg mt-md">
<!-- Welcome & Level Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-display-mobile text-display-mobile text-on-surface">Chào Sơn! 👋</h2>
<div class="inline-flex items-center gap-2 bg-tertiary-fixed border-2 border-on-tertiary-fixed rounded-full px-4 py-2 w-fit shadow-[0_3px_0_0_theme(colors.on-tertiary-fixed)]">
<span class="material-symbols-outlined text-on-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">military_tech</span>
<span class="font-label-bold text-label-bold text-on-tertiary-fixed">Chiến binh An Toàn Số — Cấp 3</span>
</div>
<!-- Gamified Progress Bar -->
<div class="mt-2 relative">
<div class="h-4 bg-surface-container-highest rounded-full border-2 border-outline-variant overflow-hidden w-full relative">
<div class="h-full bg-primary rounded-full absolute left-0 top-0 w-[60%] border-r-2 border-on-primary-fixed-variant striped-bg"></div>
</div>
<!-- Cute marker -->
<div class="absolute top-1/2 -translate-y-1/2 left-[60%] -translate-x-1/2 w-8 h-8 bg-tertiary-fixed rounded-full border-2 border-on-surface flex items-center justify-center shadow-sm z-10">
<span class="material-symbols-outlined text-sm text-on-surface" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</section>
<!-- Main Mission Card -->
<section class="w-full">
<div class="bg-surface-container-lowest rounded-xl border-2 border-surface-variant p-md shadow-[0_6px_0_0_theme(colors.surface-variant)] flex flex-col gap-md relative overflow-hidden group">
<!-- Decorative background blob -->
<div class="absolute -right-10 -top-10 w-32 h-32 bg-primary-fixed rounded-full opacity-50 blur-2xl"></div>
<div class="flex items-start justify-between relative z-10">
<div class="flex flex-col gap-1">
<span class="font-label-bold text-label-bold text-outline uppercase tracking-wider">Nhiệm vụ hôm nay</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Nhận diện link lừa đảo</h3>
</div>
<div class="w-14 h-14 bg-secondary-fixed rounded-full flex items-center justify-center border-2 border-on-secondary-fixed shadow-[0_2px_0_0_theme(colors.on-secondary-fixed)]">
<span class="material-symbols-outlined text-on-secondary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
<div class="flex flex-col gap-2 relative z-10">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Tiến độ</span>
<span class="font-label-bold text-label-bold text-primary">2/5 bài</span>
</div>
<div class="h-3 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary w-[40%] rounded-full"></div>
</div>
</div>
<button class="mt-2 min-h-[56px] w-full bg-primary text-on-primary font-label-bold text-label-bold rounded-xl border-2 border-on-primary-fixed-variant shadow-[0_4px_0_0_theme(colors.on-primary-fixed-variant)] tactile-active flex items-center justify-center gap-2 relative z-10 transition-all">
<span>Bắt đầu</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</section>
<!-- Action Cards Grid -->
<section class="grid grid-cols-2 gap-margin-mobile w-full">
<!-- Card 1 -->
<button class="bg-surface-container-lowest rounded-xl border-2 border-surface-variant p-sm flex flex-col items-center justify-center gap-3 shadow-[0_4px_0_0_theme(colors.surface-variant)] tactile-active transition-all min-h-[140px]">
<div class="w-12 h-12 bg-primary-fixed rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface text-center">Luyện tình huống</span>
</button>
<!-- Card 2 -->
<button class="bg-surface-container-lowest rounded-xl border-2 border-surface-variant p-sm flex flex-col items-center justify-center gap-3 shadow-[0_4px_0_0_theme(colors.surface-variant)] tactile-active transition-all min-h-[140px]">
<div class="w-12 h-12 bg-tertiary-fixed rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-2xl" style="font-variation-settings: 'FILL' 1;">search</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface text-center">Kiểm tra link / tin nhắn</span>
</button>
<!-- Card 3 (Mascot) -->
<button class="bg-surface-container-lowest rounded-xl border-2 border-surface-variant p-sm flex flex-col items-center justify-center gap-3 shadow-[0_4px_0_0_theme(colors.surface-variant)] tactile-active transition-all min-h-[140px] relative overflow-hidden">
<div class="absolute inset-0 bg-primary opacity-5"></div>
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-primary-fixed bg-white">
<img alt="Mascot Cú Cú" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxqKieRxuS3MlvFe2cUnNR3xK_033-2ZIKKhCqMbQ_uku6a2hY3L1UzXq2bvR53R0WTwcbkyNHgRMejtetleztnt1smzaF0Qnl_CYCaUmkN3M-gc-4WL6z1AWBHRKXf_AIob8kS3hUUxBgCTFbC7nqlcChbF-Xjq1Tt2Rfe0IqtS3TGD_d22qxciCMXeMO8VxPXhpQrc3sDjG-bVS8kMlqVOE10wvLHe7ZBt_vvmVW4F-a4VXXEDY_VkIcUkkCi0z-tL0ZXqAkATQ"/>
</div>
<span class="font-label-bold text-label-bold text-primary text-center z-10">Hỏi Cú Cú AI</span>
</button>
<!-- Card 4 (SOS) -->
<button class="bg-error-container rounded-xl border-2 border-on-error-container p-sm flex flex-col items-center justify-center gap-3 shadow-[0_4px_0_0_theme(colors.on-error-container)] tactile-active transition-all min-h-[140px]">
<div class="w-12 h-12 bg-error rounded-full flex items-center justify-center text-on-error shadow-inner">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">sos</span>
</div>
<span class="font-label-bold text-label-bold text-on-error-container text-center">Con cần giúp đỡ</span>
</button>
</section>
<!-- Bottom Stats & Tips -->
<section class="flex flex-col gap-margin-mobile w-full pb-8">
<div class="flex gap-margin-mobile w-full">
<!-- Badge -->
<div class="flex-1 bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-3 flex items-center gap-3 shadow-[0_3px_0_0_theme(colors.surface-variant)]">
<img alt="Badge" class="w-10 h-10 object-contain" data-alt="A 3D rendered gamified badge icon featuring a bright golden shield with a star in the center. It has a thick white outline and soft purple accents, sitting on a pure white background with a subtle drop shadow to emphasize its 3D, skeuomorphic, and playful educational style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOBNmc5kGbL7N7-qJ1yHAutdQUMsfgTzQ4B0XXAdUkKZCmtE4Kb-FPjEGXKmtnsmD8-jbapRr9Q19h4ONy0RwKrDNZp6FmkLsrMz0UVZ1dAhRPo4R2RSqOsneM4FXiDb7GR2WCCZKnrKjDp1gU3RvLjUqaIqHHe3tgGnxm6I_joJ-7oPCYdkWApZ1sSqlXVekdNPxqmF5-aaxdxjj4QVoStNjXEsERvwI_E7RlqwKkH1NM2_lOkBDuIL7dR1zQiV3ysHiPrnzMJjQ"/>
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline">Huy hiệu mới</span>
<span class="font-label-bold text-label-bold text-on-surface">Mắt Cú Tinh Anh</span>
</div>
</div>
<!-- Streak -->
<div class="flex-1 bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-3 flex items-center gap-3 shadow-[0_3px_0_0_theme(colors.surface-variant)]">
<div class="w-10 h-10 rounded-full bg-tertiary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline">Chuỗi học tập</span>
<span class="font-label-bold text-label-bold text-on-surface">5 ngày</span>
</div>
</div>
</div>
<!-- Tip Card -->
<div class="bg-primary-fixed rounded-xl p-md border-2 border-primary shadow-[0_4px_0_0_theme(colors.primary)] flex gap-4 items-start">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">tips_and_updates</span>
<div class="flex flex-col gap-1">
<span class="font-label-bold text-label-bold text-on-primary-fixed uppercase tracking-wide">Mẹo An Toàn</span>
<p class="font-body-md text-body-md text-on-primary-fixed font-medium">"Không ai được phép xin mã OTP của con."</p>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (SOS Contextual) -->
<button class="fixed bottom-[100px] right-margin-mobile z-40 bg-error text-on-error w-16 h-16 rounded-full flex items-center justify-center shadow-[0_6px_0_0_theme(colors.on-error-container)] tactile-active transition-all md:right-lg md:bottom-lg">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</button>
<!-- JSON Component: BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-4 pt-2 bg-surface-container border-t-4 border-surface-variant shadow-lg rounded-t-lg">
<!-- Active Tab: Trang chủ -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 translate-y-[-2px] shadow-[0_4px_0_0_rgba(0,74,198,1)] transition-all duration-100 w-16 h-14">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px]">Trang chủ</span>
</button>
<!-- Inactive Tab: Luyện kỹ năng -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright transition-transform duration-150 w-16 h-14">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">school</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px] text-center line-clamp-1">Luyện kỹ năng</span>
</button>
<!-- Inactive Tab: Quét nguy hiểm -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright transition-transform duration-150 w-16 h-14">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">security</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px] text-center line-clamp-1">Quét nguy hiểm</span>
</button>
<!-- Inactive Tab: Hồ sơ -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright transition-transform duration-150 w-16 h-14">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px] text-center line-clamp-1">Hồ sơ</span>
</button>
</nav>
</body></html>
